<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ Tìm Đường Kyoto</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --sidebar-bg: #2c3e50;
            --accent: #3498db;
            --text-light: #ecf0f1;
        }

        body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        #sidebar { 
            width: 360px; background-color: var(--sidebar-bg); color: var(--text-light);
            padding: 20px; box-shadow: 4px 0 15px rgba(0,0,0,0.3); z-index: 1000; 
            display: flex; flex-direction: column; gap: 15px; overflow-y: auto;
        }

        #map { flex-grow: 1; height: 100vh; z-index: 1; position: relative; }

        h2 { margin: 0; font-size: 18px; text-align: center; color: var(--accent); border-bottom: 1px solid #444; padding-bottom: 10px; text-transform: uppercase; }

        .control-group { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 12px; border: 1px solid rgba(255,255,255,0.1); }
        label { font-weight: bold; font-size: 12px; color: #bdc3c7; margin-bottom: 8px; display: block; }

        select, input { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #34495e; color: white; margin-bottom: 8px; outline: none; box-sizing: border-box;}
        input[readonly] { cursor: not-allowed; opacity: 0.8; font-size: 13px; }

        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; transition: 0.3s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-warning { background: #e74c3c; color: white; } 
        .btn:hover { opacity: 0.8; }

        .perf-card { background: #1a252f; border: 1px solid var(--accent); border-radius: 6px; padding: 10px; }
        .perf-item { font-size: 13px; padding: 5px 0; border-bottom: 1px solid #34495e; display: flex; justify-content: space-between; }
        .perf-item:last-child { border: none; }
        .perf-value { color: var(--accent); font-family: monospace; font-weight: bold; font-size: 15px; }

        #admin-link {
            position: absolute; top: 20px; right: 20px; background: rgba(44, 62, 80, 0.9); color: white;
            padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; z-index: 1000;
            border: 2px solid var(--accent); box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        #admin-link:hover { background: var(--accent); transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Hệ Thống Tìm Đường</h2>

        <div class="control-group">
            <label>1. CHỌN ĐỊA ĐIỂM</label>
            <input type="text" id="start-input" placeholder="Điểm bắt đầu..." readonly>
            <input type="text" id="end-input" placeholder="Điểm kết thúc..." readonly>
            <button class="btn btn-warning" onclick="clearSelection()">✖ Hủy điểm đã chọn</button>
        </div>

        <div class="control-group">
            <label>2. CHỌN THUẬT TOÁN</label>
            <select id="algoSelect">
                <option value="A*">Thuật toán A*</option>
                <option value="Dijkstra">Thuật toán Dijkstra</option>
                <option value="BFS">Breadth-First Search (BFS)</option>
                <option value="DFS">Depth-First Search (DFS)</option>
            </select>
            <button class="btn btn-primary" onclick="findPath()">🚀 TÌM ĐƯỜNG ĐI</button>
        </div>

        <div class="control-group" id="perf-section" style="display: none;">
            <label>KẾT QUẢ TÍNH TOÁN</label>
            <div class="perf-card">
                <div class="perf-item">Thời gian: <span class="perf-value" id="p-time">0 ms</span></div>
                <div class="perf-item">Độ dài: <span class="perf-value" id="p-dist">0 m</span></div>
                </div>
            <p id="route-message" style="color: #f1c40f; font-size: 12px; margin-top: 10px; text-align: center; font-weight: bold;"></p>
        </div>
    </div>

    <div id="map">
        <a href="admin.html" id="admin-link">⚙️ Chế độ Admin</a>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="mapData.js"></script> 

    <script>
        const map = L.map('map').setView([35.0116, 135.7681], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);

        if (typeof kyotoGeoData !== 'undefined') {
            L.geoJSON(kyotoGeoData, {
                pointToLayer: function (f, l) { return L.circleMarker(l, { radius: 0, opacity: 0 }); },
                style: { color: "red", weight: 3, fillOpacity: 0 }
            }).addTo(map);
        }

        let startMarker = null;
        let endMarker = null;
        
        let routeLayerGroup = L.featureGroup().addTo(map);

        map.on('click', function(e) {
            const latlng = e.latlng;
            if (!startMarker) {
                startMarker = L.marker(latlng).addTo(map).bindPopup("<b>A</b> - Xuất phát").openPopup();
                document.getElementById('start-input').value = `Vĩ: ${latlng.lat.toFixed(4)}, Kinh: ${latlng.lng.toFixed(4)}`;
            } else if (!endMarker) {
                endMarker = L.marker(latlng).addTo(map).bindPopup("<b>B</b> - Đích đến").openPopup();
                document.getElementById('end-input').value = `Vĩ: ${latlng.lat.toFixed(4)}, Kinh: ${latlng.lng.toFixed(4)}`;
            }
        });

        function clearSelection() {
            if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
            if (endMarker) { map.removeLayer(endMarker); endMarker = null; }
            routeLayerGroup.clearLayers(); 
            
            document.getElementById('start-input').value = "";
            document.getElementById('end-input').value = "";
            document.getElementById('perf-section').style.display = 'none';
        }

        function findPath() {
            if (!startMarker || !endMarker) {
                alert("Vui lòng chọn Điểm Bắt Đầu và Điểm Kết Thúc!");
                return;
            }

            const requestData = {
                start: { lat: startMarker.getLatLng().lat, lng: startMarker.getLatLng().lng },
                end: { lat: endMarker.getLatLng().lat, lng: endMarker.getLatLng().lng },
                algorithm: document.getElementById('algoSelect').value
            };

            document.getElementById('perf-section').style.display = 'block';
            document.getElementById('p-time').innerText = "...";
            document.getElementById('route-message').innerText = "Đang xử lý...";

            fetch('http://localhost:5000/api/find-path', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestData)
            })
            .then(res => res.json())
            .then(data => {
                document.getElementById('p-time').innerText = data.execution_time + " ms";
                document.getElementById('p-dist').innerText = data.total_distance + " m";
                // Đã xóa lệnh in Số Node ở đây
                document.getElementById('route-message').innerText = data.message;

                routeLayerGroup.clearLayers();

                data.segments.forEach(segment => {
                    let polylineStyle;
                    
                    if (segment.mode === "walk") {
                        polylineStyle = { color: '#2ecc71', weight: 5, dashArray: '10, 10', opacity: 0.8 }; 
                    } else if (segment.mode === "subway") {
                        polylineStyle = { color: '#3498db', weight: 6, opacity: 1.0 }; 
                    }

                    let segmentLine = L.polyline(segment.coordinates, polylineStyle);
                    routeLayerGroup.addLayer(segmentLine);
                });

                map.fitBounds(routeLayerGroup.getBounds());
            })
            .catch(err => {
                console.error(err);
                alert("Lỗi kết nối Backend!");
            });
        }
    </script>
</body>
</html>
